<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <filter id="soft-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.45" />
    </filter>
    <filter id="glow-subtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F7EFE6" />
      <stop offset="100%" stop-color="#E5D6C5" />
    </linearGradient>

    <linearGradient id="coffeeSurface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#915938" />
      <stop offset="100%" stop-color="#552C14" />
    </linearGradient>

    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#99E2B4" />
      <stop offset="50%" stop-color="#52B788" />
      <stop offset="100%" stop-color="#2D6A4F" />
    </linearGradient>

    <linearGradient id="steamGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#F7EFE6" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#E29578" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="beanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B06D46" />
      <stop offset="100%" stop-color="#5E351A" />
    </linearGradient>
  </defs>

  <!-- Plato Base de la Taza -->
  <ellipse cx="250" cy="340" rx="146" ry="20" fill="#000000" opacity="0.35" filter="url(#soft-shadow)" />
  <ellipse cx="250" cy="332" rx="140" ry="16" fill="url(#cupGrad)" stroke="#D4C0A8" stroke-width="2.5" />
  <ellipse cx="250" cy="329" rx="104" ry="9" fill="#E8D9C8" opacity="0.6" />

  <!-- Cuerpo de la Taza de Café -->
  <g id="cup-group" filter="url(#soft-shadow)">
    <!-- Asa de la taza -->
    <path d="M 334 208 C 400 208, 400 292, 334 292" fill="none" stroke="url(#cupGrad)" stroke-width="18" stroke-linecap="round" />
    <path d="M 334 213 C 385 213, 385 287, 334 287" fill="none" stroke="#D4C0A8" stroke-width="3" opacity="0.4" />

    <!-- Silueta principal taza -->
    <path d="M 154 192 C 156 284, 195 320, 250 320 C 305 320, 344 284, 346 192 Z" fill="url(#cupGrad)" stroke="#D4C0A8" stroke-width="2.5" />
    <!-- Borde superior elíptico -->
    <ellipse cx="250" cy="192" rx="96" ry="20" fill="url(#cupGrad)" stroke="#D4C0A8" stroke-width="2.5" />
    <!-- Superficie líquida café -->
    <ellipse cx="250" cy="193" rx="86" ry="15" fill="url(#coffeeSurface)" />
    <!-- Crema / Latte Art sutil -->
    <path d="M 232 193 C 244 188, 256 188, 268 193 C 260 197, 240 197, 232 193 Z" fill="#FFFFFF" opacity="0.8" />
  </g>

  <!-- Hoja Verde Orgánica (Símbolo ODS 12 / Sustentabilidad) -->
  <g id="organic-leaf" filter="url(#glow-subtle)">
    <path d="M 250 160 C 298 122, 312 74, 278 50 C 248 82, 246 126, 250 160 Z" fill="url(#leafGrad)" />
    <!-- Nervadura central de la hoja -->
    <path d="M 252 155 C 255 119, 270 86, 278 52" fill="none" stroke="#E8F8F5" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />
  </g>

  <!-- Vapores de Café Aromático Curvos -->
  <g id="aroma-steam" stroke="url(#steamGrad)" stroke-width="6" stroke-linecap="round" fill="none">
    <path d="M 208 170 C 196 141, 212 120, 200 90 C 190 68, 202 50, 196 38" />
    <path d="M 230 162 C 223 131, 236 112, 227 84 C 220 62, 230 48, 225 32" stroke-width="5" opacity="0.9" />
  </g>

  <!-- Granos de Café Orgánico a los Lados -->
  <!-- Grano Izquierdo -->
  <g id="bean-left" transform="translate(120, 308) rotate(-22) scale(1.15)" filter="url(#soft-shadow)">
    <ellipse cx="0" cy="0" rx="19" ry="13" fill="url(#beanGrad)" stroke="#3E2413" stroke-width="1.8" />
    <path d="M 0 -11 C -4 -4, 4 4, 0 11" fill="none" stroke="#F7EFE6" stroke-width="2.2" stroke-linecap="round" opacity="0.9" />
  </g>
  <!-- Grano Derecho -->
  <g id="bean-right" transform="translate(380, 310) rotate(24) scale(1.15)" filter="url(#soft-shadow)">
    <ellipse cx="0" cy="0" rx="19" ry="13" fill="url(#beanGrad)" stroke="#3E2413" stroke-width="1.8" />
    <path d="M 0 -11 C -4 -4, 4 4, 0 11" fill="none" stroke="#F7EFE6" stroke-width="2.2" stroke-linecap="round" opacity="0.9" />
  </g>

  <!-- Tipografía Integrada 'MONCHIS CAFÉ' -->
  <g id="brand-typography">
    <text x="250" y="415" text-anchor="middle" font-family="'Century Gothic', 'Montserrat', 'Segoe UI', Arial, sans-serif" font-size="40" font-weight="900" fill="#FFFDF9" letter-spacing="5">MONCHIS CAFÉ</text>
    <text x="250" y="452" text-anchor="middle" font-family="'Century Gothic', 'Montserrat', 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#E29578" letter-spacing="5">ORGÁNICO · ESPECIALIDAD</text>
  </g>
</svg>
