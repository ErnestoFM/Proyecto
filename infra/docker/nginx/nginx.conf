# ==============================================================================
# Monchis Café — Reverse Proxy Gateway Nginx (Producción y Staging Seguro)
# Configuración Criptográfica Grado A+ SSL/TLS, HSTS, WAF Perimetral y CSP
# ==============================================================================

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Ocultar versión de Nginx para mitigar fingerprinting de atacantes
    server_tokens off;

    # Límite de tamaño de peticiones para mitigar desbordamientos y DoS
    client_max_body_size 10M;

    # Configuración de Timeouts
    client_body_timeout 12s;
    client_header_timeout 12s;
    keepalive_timeout 65s;
    send_timeout 10s;

    # Upstreams de la red interna Docker
    upstream frontend_upstream {
        server web:3000;
    }

    upstream backend_upstream {
        server api:8080;
    }

    upstream rabbitmq_upstream {
        server rabbitmq:15672;
    }

    # --------------------------------------------------------------------------
    # 1. Servidor HTTP (Puerto 80) — Redirección Forzosa a HTTPS (301)
    # --------------------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name localhost monchiscafe.local;

        # Desafíos ACME para renovación automática Let's Encrypt / Certbot
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirección global estricta a HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # --------------------------------------------------------------------------
    # 2. Servidor HTTPS Seguro (Puerto 443) con HTTP/2 y TLS Moderno
    # --------------------------------------------------------------------------
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name localhost monchiscafe.local;

        # Certificados SSL/TLS (Montados como volumen)
        ssl_certificate /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;

        # Protocolos TLS Modernos (Bloqueo estricto de SSLv3, TLS 1.0 y TLS 1.1)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384";

        # Optimización de Rendimiento TLS
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;

        # ----------------------------------------------------------------------
        # Encabezados de Seguridad Perimetrales (OWASP & HSTS)
        # ----------------------------------------------------------------------
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' http://localhost:8080 http://localhost:3000 https://*; frame-src 'self' https://www.google.com/recaptcha/;" always;

        # Proxy para API Backend (Next.js)
        location /api/ {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_cache_bypass $http_upgrade;
        }

        # Proxy para Panel de RabbitMQ Management (Restringido)
        location /rabbitmq/ {
            proxy_pass http://rabbitmq_upstream/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Proxy para Frontend Vue 3 SPA (vite-ssg)
        location / {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
