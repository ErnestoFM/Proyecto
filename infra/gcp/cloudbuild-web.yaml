steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/monchis-repo/monchis-web:latest'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/monchis-repo/monchis-web:$SHORT_SHA'
      - '-f'
      - 'infra/docker/web/Dockerfile'
      - '.'
images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/monchis-repo/monchis-web:latest'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/monchis-repo/monchis-web:$SHORT_SHA'
options:
  logging: CLOUD_LOGGING_ONLY
